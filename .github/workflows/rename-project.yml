# =============================================================================
# プロジェクトリネームワークフロー
# -----------------------------------------------------------------------------
# 生成されたリポジトリに常駐する。Actions タブから手動実行し、
# リポジトリ直下の Unity プロジェクトのディレクトリ名と
# ProjectSettings.asset の productName を、入力した 1 つの名前へまとめて変更する。
#
# 対象プロジェクトの選び方:
#   - project 入力が空 (既定) → リポジトリ直下のプロジェクトを自動検出する。
#     1 つだけなら迷わず使え、複数ある場合は候補一覧を表示してエラー停止する。
#   - project 入力あり     → そのディレクトリを対象にする (存在しなければ候補一覧付きでエラー)。
#
# ※ workflow_dispatch の choice 型はリポジトリ内容から動的に生成できない
#    (選択肢を YAML に静的に書く必要がある) ため、自動検出 + 候補提示で代替している。
# =============================================================================
name: Rename Project

on:
  workflow_dispatch:
    inputs:
      name:
        description: '新しいプロジェクト名 (ディレクトリ名と productName の両方に適用)'
        required: true
        type: string
      project:
        description: '対象プロジェクトのディレクトリ名 (空欄なら自動検出。複数ある場合のみ指定)'
        required: false
        type: string
        default: ''

jobs:
  rename-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 自由入力テキストはシェルへ直接展開せず env 経由で渡す
    env:
      NEW_NAME: ${{ inputs.name }}
      TARGET: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4

      # ── 対象プロジェクトの決定 (自動検出 or 入力検証) ──────
      - name: Detect project directory
        id: detect
        run: |
          mapfile -t projects < <(find . -mindepth 3 -maxdepth 3 -type f -path './*/ProjectSettings/ProjectVersion.txt' | cut -d/ -f2 | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::Unity プロジェクトが見つかりません"
            exit 1
          fi
          if [ -n "$TARGET" ]; then
            if [ ! -f "$TARGET/ProjectSettings/ProjectVersion.txt" ]; then
              echo "::error::'$TARGET' は Unity プロジェクトとして見つかりません。候補: ${projects[*]}"
              exit 1
            fi
            echo "dir=$TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#projects[@]}" -gt 1 ]; then
            echo "::error::プロジェクトが複数あるため対象を自動判別できません。project 入力に次のいずれかを指定して再実行してください: ${projects[*]}"
            exit 1
          fi
          echo "dir=${projects[0]}" >> "$GITHUB_OUTPUT"

      # ── ディレクトリ名 + productName の一括リネーム ────────
      - name: Rename project
        env:
          CUR_DIR: ${{ steps.detect.outputs.dir }}
        run: bash .github/scripts/rename-project.sh "$CUR_DIR" "$NEW_NAME"

      - name: Commit
        env:
          CUR_DIR: ${{ steps.detect.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: rename project $CUR_DIR to $NEW_NAME"
          git push
